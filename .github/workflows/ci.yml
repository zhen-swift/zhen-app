name: CI

# Fast feedback on every pull request and every push to main. AGENTS.md's CI section adds
# `bundle exec fastlane test` once phase 3 brings fastlane; until then the jobs here are the
# ones that exist.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    # First, because it is seconds long and it is the rule the previous app broke most:
    # 351 lines of colour in code and 18 computed views, none of them checked.
    name: Tokens — no literals in a view
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The self-test before the check. The rules are POSIX regexes written on a Mac's BSD
      # grep and run here on GNU grep; a pattern one of them reads differently would make the
      # check below pass on nothing. This proves every rule still fires on this runner.
      - name: Self-test
        run: ./Scripts/check-tokens.sh --self-test

      - name: Check the app's sources
        run: ./Scripts/check-tokens.sh

  app:
    # The app's own tests, unit and UI. Phase 1's "CI green" never ran them: this job is
    # what makes it mean the suite passed.
    name: App — build and test the Zhen scheme
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      # The plist is generated from zhen-core; a stale one is a Bonjour type browsed and
      # never declared, which fails silently at runtime. Fail here instead.
      - name: NSBonjourServices matches zhen-core
        run: ./Scripts/generate-bonjour-services.sh --check

      # Ad-hoc signing: forks have no team, and a UI test needs a runnable, signed app.
      - name: Test
        shell: bash
        run: |
          mkdir -p fastlane/test_output
          xcodebuild test \
            -project Zhen.xcodeproj -scheme Zhen -destination 'platform=macOS' \
            -resultBundlePath fastlane/test_output/Zhen.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            | tee fastlane/test_output/xcodebuild.log

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: fastlane/test_output
          retention-days: 14
