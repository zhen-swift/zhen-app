name: Screenshots

# The App Store and README artwork, on demand and for release tags.
#
# It RE-RENDERS from committed captures (`fastlane marketing`); it does not capture. A Mac
# capture must be 2880 × 1800, which only a Retina display produces — a 1× runner's
# captures are undersized and the renderer refuses them (AGENTS.md, macOS targets). So
# captures are taken locally with `bundle exec fastlane screenshots` and committed to
# AppStoreSimulatorCaptures/macOS/ (Docs/SCREENSHOTS.md). Workflows never commit back:
# download the artifacts, review, commit deliberately.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  render:
    name: Render artwork from committed captures
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Until the first captures are committed there is nothing to render, and a run that
      # uploads empty artifacts looks like a run that worked. Say so and stop instead.
      - name: Captures committed?
        id: captures
        run: |
          if compgen -G "AppStoreSimulatorCaptures/macOS/*.png" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No captures in AppStoreSimulatorCaptures/macOS — take them locally with 'bundle exec fastlane screenshots' (Docs/SCREENSHOTS.md). Nothing rendered."
          fi

      - if: steps.captures.outputs.present == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Render
        if: steps.captures.outputs.present == 'true'
        run: bundle exec fastlane marketing
      - if: steps.captures.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: appstore-assets
          path: AppStoreAssets
          retention-days: 30
      - if: steps.captures.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: readme-artwork
          path: Docs/assets
          retention-days: 30
      - if: steps.captures.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: raw-captures
          path: AppStoreSimulatorCaptures
          retention-days: 14
